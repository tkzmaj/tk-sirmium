<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TK Sirmium | Teniska liga</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f4ef;background:#091b18}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#123d31,#0b211d);padding:24px 18px;border-bottom:1px solid #2d5c48}.wrap{max-width:960px;margin:auto}.eyebrow{color:#b3df76;font-size:12px;font-weight:800;letter-spacing:2px}h1{font-size:32px;margin:6px 0}p{color:#afc5ba}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,input,select{font:inherit}button{cursor:pointer;background:#183c30;color:#e8f5ec;border:1px solid #386b54;border-radius:10px;padding:11px 14px}button.active,.primary{background:#b5e86c;color:#12261b;border-color:#b5e86c;font-weight:800}main{padding:22px 18px}.panel{background:#102b24;border:1px solid #2a4c3e;border-radius:16px;padding:20px;margin-bottom:18px}h2{margin:0 0 15px;font-size:21px}.muted{color:#afc5ba}.hidden{display:none}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #2c4b3e}th{color:#b5e86c;font-size:13px}tr:last-child td{border-bottom:0}.match{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #2c4b3e}.match:last-child{border:0}.score{color:#b5e86c;font-weight:800;white-space:nowrap}label{display:block;color:#cde5d7;font-size:13px;margin:12px 0 5px}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #426d58;background:#091b18;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{font-size:13px;color:#b3cbbb;margin-top:12px}.error{color:#ffb2a6}.success{color:#b5e86c}@media(max-width:580px){.grid{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">🎾 TENISKA LIGA</div><h1>TK Sirmium</h1><p>Rezultati, mečevi i tabele na jednom mestu.</p><nav><button class="active" data-tab="standings">🏆 Tabela</button><button data-tab="matches">🎾 Mečevi</button><button data-tab="players">👥 Igrači</button><button data-tab="admin">🔐 Admin</button></nav></div></header>
<main class="wrap"><div id="status" class="notice"></div>
<section id="standings" class="panel"><h2>🏆 Tabela lige</h2><nav><button class="active" data-league="A">A liga</button><button data-league="B">B liga</button></nav><div class="scroll"><table><thead><tr><th>#</th><th>Igrač</th><th>Odigrano</th><th>Pobede</th><th>Porazi</th></tr></thead><tbody id="standings-body"></tbody></table></div></section>
<section id="matches" class="panel hidden"><h2>🎾 Odigrani mečevi</h2><div id="matches-body"></div></section>
<section id="players" class="panel hidden"><h2>👥 Igrači</h2><div id="players-body"></div></section>
<section id="admin" class="panel hidden"><h2>🔐 Administratorska prijava</h2><div id="login"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Lozinka</label><input id="password" type="password" autocomplete="current-password"><p><button class="primary" id="login-btn">Prijavi se</button></p></div><div id="admin-tools" class="hidden"><p>Prijavljen administrator</p><button id="logout-btn">Odjavi se</button><h2 style="margin-top:24px">Dodaj rezultat</h2><div class="grid"><div><label>Prvi igrač</label><select id="p1"></select></div><div><label>Drugi igrač</label><select id="p2"></select></div><div><label>Setovi prvog igrača</label><input id="s1" type="number" min="0" max="5" value="2"></div><div><label>Setovi drugog igrača</label><input id="s2" type="number" min="0" max="5" value="0"></div></div><p><button class="primary" id="save-btn">Sačuvaj meč</button></p></div><p id="admin-message" class="notice"></p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// OVDE UNESI SAMO PUBLISHABLE KEY (nikada secret key).
const SUPABASE_URL='https://rdayatukgiwwxlcyzsdj.supabase.co';
const SUPABASE_KEY='sb_publishable_3L1z1eRIjeOcLByuKEncew_9IBIRdxi';
const ready=SUPABASE_KEY.startsWith('sb_publishable_')&&window.supabase;
const db=ready?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let players=[],matches=[],league='A',isAdmin=false;
const el=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const showMessage=(msg,error=false)=>{el('status').textContent=msg;el('status').className='notice '+(error?'error':'')};
const playerName=id=>players.find(p=>String(p.id)===String(id))?.name||'Nepoznat igrač';
function render(){const list=players.filter(p=>p.league===league);const stats=list.map(p=>{const own=matches.filter(m=>String(m.player1_id)===String(p.id)||String(m.player2_id)===String(p.id));const wins=own.filter(m=>(String(m.player1_id)===String(p.id)&&m.sets1>m.sets2)||(String(m.player2_id)===String(p.id)&&m.sets2>m.sets1)).length;return {...p,played:own.length,wins,losses:own.length-wins}}).sort((a,b)=>b.wins-a.wins||a.losses-b.losses||a.name.localeCompare(b.name));el('standings-body').innerHTML=stats.length?stats.map((p,i)=>`<tr><td>${i+1}</td><td>${safe(p.name)}</td><td>${p.played}</td><td>${p.wins}</td><td>${p.losses}</td></tr>`).join(''):'<tr><td colspan="5">Još nema igrača u ovoj ligi.</td></tr>';el('players-body').innerHTML=players.length?players.map(p=>`<div class="match"><strong>${safe(p.name)}</strong><span class="muted">${safe(p.league)} liga</span></div>`).join(''):'<p class="muted">Nema unetih igrača.</p>';el('matches-body').innerHTML=matches.length?matches.map(m=>`<div class="match"><span>${safe(playerName(m.player1_id))} – ${safe(playerName(m.player2_id))}</span><span class="score">${m.sets1} : ${m.sets2}</span></div>`).join(''):'<p class="muted">Nema unetih mečeva.</p>';const options=players.map(p=>`<option value="${safe(p.id)}">${safe(p.name)} (${safe(p.league)})</option>`).join('');el('p1').innerHTML=options;el('p2').innerHTML=options;if(players.length>1)el('p2').selectedIndex=1;}
async function load(){if(!db){showMessage('Potrebno je uneti Supabase Publishable key u kod.',true);render();return}const [pr,mr]=await Promise.all([db.from('players').select('*'),db.from('matches').select('*')]);if(pr.error||mr.error){showMessage('Greška pri čitanju baze: '+(pr.error?.message||mr.error?.message),true);return}players=pr.data||[];matches=mr.data||[];render();showMessage('Podaci učitani iz baze.');}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));el(b.dataset.tab).classList.remove('hidden')});document.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{league=b.dataset.league;document.querySelectorAll('[data-league]').forEach(x=>x.classList.toggle('active',x===b));render()});
async function authState(){if(!db)return;const {data}=await db.auth.getUser();if(!data.user){isAdmin=false}else{const {data:membership}=await db.from('admins').select('user_id').eq('user_id',data.user.id).maybeSingle();isAdmin=!!membership}el('login').classList.toggle('hidden',isAdmin);el('admin-tools').classList.toggle('hidden',!isAdmin)}
el('login-btn').onclick=async()=>{if(!db)return;const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});el('password').value='';if(error){el('admin-message').textContent=error.message;return}await authState();el('admin-message').textContent=isAdmin?'Uspešna prijava.':'Ovaj nalog nema administratorska prava.'};
el('logout-btn').onclick=async()=>{await db.auth.signOut();await authState()};
el('save-btn').onclick=async()=>{if(!db||!isAdmin)return;const a=el('p1').value,b=el('p2').value,s1=Number(el('s1').value),s2=Number(el('s2').value);if(!a||!b||a===b||!Number.isInteger(s1)||!Number.isInteger(s2)||s1<0||s2<0||s1===s2){el('admin-message').textContent='Izaberi dva različita igrača i ispravan rezultat.';return}const pa=players.find(p=>String(p.id)===a),pb=players.find(p=>String(p.id)===b);if(pa.league!==pb.league){el('admin-message').textContent='Igrači moraju biti iz iste lige.';return}const {error}=await db.from('matches').insert({player1_id:a,player2_id:b,sets1:s1,sets2:s2});el('admin-message').textContent=error?'Greška: '+error.message:'Meč je sačuvan!';if(!error)await load()};
load().then(authState);
</script>
</body></html>
