<!doctype html><html lang="sr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c25"><link rel="manifest" href="manifest.webmanifest"><title>TK Sirmium</title><style>body{margin:0;background:#edf2ee;color:#16352c;font:16px system-ui}header{background:#102c25;color:white;padding:22px}main{max-width:780px;margin:auto;padding:16px}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #b8c9bf}button{background:#d5ed64;cursor:pointer}button.active{background:#183e32;color:white}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #1232}table{width:100%;border-collapse:collapse}td,th{padding:10px 5px;text-align:left;border-bottom:1px solid #eee}input,select{max-width:100%;box-sizing:border-box}.muted{color:#60766b;font-size:13px}.danger{background:#fbd8d8}#status{font-size:13px}</style></head><body><header><h1>🎾 TK SIRMIUM</h1><div>Тениска лига • А и Б лига</div><p id="status">Демо режим — подаци на овом уређају</p></header><main><div class="tabs"><button onclick="tab('table')">Табела</button><button onclick="tab('matches')">Мечеви</button><button onclick="tab('admin')">Тренер</button></div><p class="row"><button id="la" onclick="setLeague('A')">А лига</button><button id="lb" onclick="setLeague('B')">Б лига</button></p><section id="content"></section></main><script>
let state=JSON.parse(localStorage.getItem('sirmium-v1')||'null')||{players:[{id:1,name:'Играч А1',league:'A'},{id:2,name:'Играч А2',league:'A'},{id:3,name:'Играч А3',league:'A'},{id:4,name:'Играч Б1',league:'B'},{id:5,name:'Играч Б2',league:'B'},{id:6,name:'Играч Б3',league:'B'}],matches:[{id:1,league:'A',a:1,b:2,sa:2,sb:0},{id:2,league:'B',a:4,b:5,sa:2,sb:1}]};let league='A',view='table',edit=false;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('sirmium-v1',JSON.stringify(state));const name=id=>state.players.find(p=>p.id===id)?.name||'Непознат';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setLeague(l){league=l;render()}function tab(t){view=t;render()}function standings(){return state.players.filter(p=>p.league===league).map(p=>{let ms=state.matches.filter(m=>m.a===p.id||m.b===p.id);let w=ms.filter(m=>m.a===p.id?m.sa>m.sb:m.sb>m.sa).length;return {...p,played:ms.length,w,loss:ms.length-w,pts:2*w}}).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.name.localeCompare(b.name))}function render(){ $('la').className=league==='A'?'active':'';$('lb').className=league==='B'?'active':'';let out='';if(view==='table'){out='<div class="card"><h2>'+league+' лига — табела</h2><table><tr><th>#</th><th>Играч</th><th>О</th><th>П</th><th>И</th><th>Бод.</th></tr>'+standings().map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.played}</td><td>${p.w}</td><td>${p.loss}</td><td><b>${p.pts}</b></td></tr>`).join('')+'</table><p class="muted">Победа = 2 бода · Пораз = 0</p></div>'}else if(view==='matches'){out='<h2>Резултати — '+league+' лига</h2>'+state.matches.filter(m=>m.league===league).map(m=>`<div class="card"><b>${esc(name(m.a))}</b> &nbsp; ${m.sa} : ${m.sb} &nbsp; <b>${esc(name(m.b))}</b>${edit?`<p><button class="danger" onclick="removeMatch(${m.id})">Обриши меч</button></p>`:''}</div>`).join('');if(!state.matches.some(m=>m.league===league))out+='<p>Још нема резултата.</p>'}else{out='<div class="card"><h2>Тренерски панел</h2>';if(!edit){out+='<p class="muted">У овој офлајн демо верзији уређивање није заштићено. За праву апликацију неопходна је пријава тренера преко сервера.</p><button onclick="edit=true;render()">Уђи у демо уређивање</button>'}else{let options=state.players.filter(p=>p.league===league).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');out+=`<button onclick="edit=false;render()">Излаз из уређивања</button><h3>Додај играча</h3><form onsubmit="addPlayer(event)"><input name="player" placeholder="Име и презиме" required maxlength="70"><button>Додај</button></form><h3>Унеси резултат</h3><form onsubmit="addMatch(event)"><p><select name="a">${options}</select></p><p><select name="b">${options}</select></p><p>Освојени сетови: <select name="sa"><option>0</option><option>1</option><option selected>2</option><option>3</option></select> : <select name="sb"><option selected>0</option><option>1</option><option>2</option><option>3</option></select></p><button>Сачувај резултат</button></form><h3>Играчи</h3>${state.players.filter(p=>p.league===league).map(p=>`<p>${esc(p.name)} <button class="danger" onclick="removePlayer(${p.id})">Уклони</button></p>`).join('')}`;}out+='</div>'} $('content').innerHTML=out}function addPlayer(e){e.preventDefault();let n=e.target.player.value.trim();if(!n)return;state.players.push({id:Date.now(),name:n,league});save();render()}function addMatch(e){e.preventDefault();let f=e.target,a=+f.a.value,b=+f.b.value,sa=+f.sa.value,sb=+f.sb.value;if(a===b||sa===sb){alert('Изабери два различита играча и резултат без нерешеног исхода.');return}state.matches.push({id:Date.now(),league,a,b,sa,sb});save();view='table';render()}function removeMatch(id){if(confirm('Обрисати меч?')){state.matches=state.matches.filter(m=>m.id!==id);save();render()}}function removePlayer(id){if(state.matches.some(m=>m.a===id||m.b===id)){alert('Прво уклони мечеве овог играча.');return}if(confirm('Уклонити играча?')){state.players=state.players.filter(p=>p.id!==id);save();render()}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
